<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Office Power — Cobalt">
 <defs>
  <clipPath id="tile"><rect width="512" height="512" rx="115"/></clipPath>
  <filter id="halo"  x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="42"/></filter>
  <filter id="shell" x="-25%" y="-25%" width="150%" height="150%"><feGaussianBlur stdDeviation="2.2"/></filter>
  <filter id="visor" x="-25%" y="-25%" width="150%" height="150%"><feGaussianBlur stdDeviation="1"/></filter>
  <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
   <stop offset="0" stop-color="#e3f0ff"/><stop offset="1" stop-color="#3f7ff0"/>
  </linearGradient>
  <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
   <stop offset="0" stop-color="#0b2a6b"/><stop offset="1" stop-color="#04122f"/>
  </linearGradient>
  <radialGradient id="crown" cx="50%" cy="4%" r="58%">
   <stop offset="0" stop-color="#ffffff" stop-opacity=".82"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="rim" cx="50%" cy="52%" r="70%">
   <stop offset="82%" stop-color="#f4f9ff" stop-opacity="0"/><stop offset="100%" stop-color="#f4f9ff" stop-opacity=".55"/>
  </radialGradient>
 </defs>
 <g clip-path="url(#tile)">
  <rect width="512" height="512" fill="#f4f9ff"/>
  <!-- the blue that bleeds out from behind the bot -->
  <rect x="88" y="186" width="336" height="326" rx="130" fill="#0a5cff" filter="url(#halo)"/>
  <!-- ears, drawn first so the head covers their lower half -->
  <g fill="#ffffff">
   <rect x="148" y="132" width="40" height="70" rx="19" transform="rotate(-22 168 167)"/>
   <rect x="324" y="132" width="40" height="70" rx="19" transform="rotate(22 344 167)"/>
  </g>
  <!-- head shell: chin flush with the bottom of the tile -->
  <g filter="url(#shell)">
   <rect x="70" y="172" width="372" height="340" rx="122" fill="url(#skin)"/>
   <rect x="70" y="172" width="372" height="340" rx="122" fill="url(#crown)"/>
  </g>
  <!-- visor -->
  <rect x="125" y="262" width="262" height="196" rx="74" fill="url(#glass)" filter="url(#visor)"/>
  <!-- capsule eyes -->
  <rect x="186" y="310" width="44" height="100" rx="22" fill="#ffffff"/>
  <rect x="282" y="310" width="44" height="100" rx="22" fill="#ffffff"/>
  <rect width="512" height="512" fill="url(#rim)"/>
 </g>
</svg>
